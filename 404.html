<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Page Not Found · Pratyush Prakhar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #080c14;
      --card:   #0d1421;
      --border: rgba(255,255,255,0.07);
      --blue:   #38bdf8;
      --violet: #a78bfa;
      --amber:  #fbbf24;
      --text:   #e2e8f0;
      --muted:  #64748b;
      --nav-h:  64px;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* Nav */
    nav {
      height: var(--nav-h);
      display: flex;
      align-items: center;
      padding: 0 clamp(1rem, 5vw, 4rem);
      background: rgba(8,12,20,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .nav-logo .dot { color: var(--blue); }

    /* Main */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Background orb */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.12;
      pointer-events: none;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: var(--blue);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    .error-code {
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, var(--blue) 0%, var(--violet) 55%, var(--amber) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
    }

    .error-title {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
      position: relative;
      z-index: 1;
    }

    .error-sub {
      font-size: 0.97rem;
      color: var(--muted);
      max-width: 400px;
      margin-bottom: 2.5rem;
      position: relative;
      z-index: 1;
      line-height: 1.7;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.8rem;
      background: var(--blue);
      color: #080c14;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: opacity 0.2s, transform 0.2s;
      position: relative;
      z-index: 1;
    }
    .btn-home:hover { opacity: 0.88; transform: translateY(-2px); }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.25rem clamp(1rem, 5vw, 4rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .footer-copy, .footer-loc {
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">PP<span class="dot">.</span></a>
</nav>

<main>
  <div class="orb orb-1" aria-hidden="true"></div>

  <p class="error-code">404</p>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-sub">
    The page you're looking for doesn't exist or may have been moved.
    Head back to the portfolio.
  </p>
  <a href="/" class="btn-home">← Back to Home</a>
</main>

<footer>
  <span class="footer-copy">© 2026 Pratyush Prakhar</span>
  <span class="footer-loc">Delhi · Singapore · Europe</span>
</footer>

</body>
</html>
